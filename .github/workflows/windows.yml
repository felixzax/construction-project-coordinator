name: Test and build Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run persistence and desktop tests
        run: python -m pytest -v --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package Windows desktop app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name ConstructionProjectCoordinator main.py
      - name: Verify packaged executable launches
        run: python -c "import subprocess; subprocess.run([r'dist/ConstructionProjectCoordinator/ConstructionProjectCoordinator.exe', '--smoke-test'], check=True, timeout=60)"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Include user documentation
        shell: pwsh
        run: |
          Copy-Item README.md, CHANGELOG.md -Destination dist/ConstructionProjectCoordinator/
          Compress-Archive -Path dist/ConstructionProjectCoordinator -DestinationPath dist/ConstructionProjectCoordinator-1.1.0-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ConstructionProjectCoordinator-1.1.0-Windows
          path: dist/ConstructionProjectCoordinator-1.1.0-Windows.zip
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
