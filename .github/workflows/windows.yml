name: Test and build Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run persistence and desktop tests
        run: python -m pytest -v --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build standalone Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --collect-all shiboken6 --name ConstructionProjectCoordinator main.py
      - name: Stage standalone executable and checksums
        run: python scripts/portable_build.py stage release
      - name: Verify ZIP extraction in isolated directory
        run: python scripts/portable_build.py zip-check release
      - uses: actions/upload-artifact@v4
        id: application
        with:
          name: ConstructionProjectCoordinator-1.11.0-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 90
      - name: Download exact published artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.application.outputs.artifact-id }}
          path: downloaded-artifact
          merge-multiple: true
      - name: Wait for artifact metadata if not yet visible
        if: steps.download.outcome == 'failure'
        run: Start-Sleep -Seconds 10
      - name: Retry exact artifact download
        if: steps.download.outcome == 'failure'
        id: download_retry
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.application.outputs.artifact-id }}
          path: downloaded-artifact
          merge-multiple: true
      - name: Wait before final artifact download attempt
        if: steps.download_retry.outcome == 'failure'
        run: Start-Sleep -Seconds 20
      - name: Final exact artifact download attempt
        if: steps.download_retry.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.application.outputs.artifact-id }}
          path: downloaded-artifact
          merge-multiple: true
      - name: Verify downloaded artifact without Python or Qt paths
        run: python scripts/portable_build.py verify downloaded-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
